
services:
  api:
    build: .
    container_name: predictive-api
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  frontend:
    build: .
    container_name: predictive-frontend
    command: python -m streamlit run app/frontend.py --server.address 0.0.0.0 --server.port 8501
    ports:
        - "8503:8501"
    environment:
      - API_URL=http://api:8000/predict
    depends_on:
      - api
